[project]
name = "stopmo-studio"
version = "0.1.0"
description = "Scripted stop-motion-style animation pipeline built on headless Blender"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10.0"]
voice = ["kokoro-onnx>=0.5,<0.7"]

[project.scripts]
stopmo = "stopmo.cli:main"

[project.urls]
Repository = "https://github.com/bkrabach/stopmo-studio"
Issues = "https://github.com/bkrabach/stopmo-studio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable installation from a source checkout is required: styles/ and tools/
# are intentionally not embedded in a wheel.
packages = ["src/stopmo", "src/stopmo_bl", "src/stopmo_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
