name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_public_tree.py
      - run: python -m pytest -q
      - run: bash -n tools/bl.sh tools/install_voice_tools.sh
      - run: python -m stopmo.cli --help
